# An example of one project's configuration, for <projects-root>/example-project.
# Copy it to host-config/projects/<name>-project.yaml (docs/host-config.md) and
# replace every example.invalid name: the file describes YOUR application, its
# containers and its release procedures, so it stays out of the publishable tree.
id: example-project
notes: Example only. A boilerplate application with one staging and one production container.
workspace:
  base: working-tree
  symlinks: materialize
infrastructure:
  kind: boilerplate
  orientation: |-
    The application checkout is <projects-root>/example-project. Its staging container is
    staging.example.invalid and its production container production.example.invalid.
    SSH configuration or the agent supplies authentication; never copy keys or
    instance secrets. Source repository: <REPOSITORY_URL>.
  staging:
    id: staging
    ssh:
      hostRef: ssh-config:deploy@staging.example.invalid
      workdir: /opt
    projectRoot: /opt/staging.example.invalid
    files:
      application-log: /opt/staging.example.invalid/runtime/log/current/project.log
    statusCommand: systemctl status project.service --no-pager --lines=30
    notes: Shared staging instance. Candidate tests run isolated beside it.
  deployments:
    - id: production
      ssh:
        hostRef: ssh-config:deploy@production.example.invalid
        workdir: /opt
      projectRoot: /opt/production.example.invalid
      files:
        application-log: /opt/production.example.invalid/runtime/log/current/project.log
      statusCommand: systemctl status project.service --no-pager --lines=30
      notes: Read-only during authoring; promoted only through the Deployment playbook.
  testDrive:
    requirement: required
    # The full verification (the daily cycle, the Deployment playbook): an isolated
    # drive of the whole application. A `tiers.smoke` subset may stay declared here
    # too; coding playbooks run neither per revision.
    commands:
      - id: selftest
        run: npm test
        timeoutSeconds: 900
    # The modules tier: the per-revision check of the Implementation, Plan and
    # implement, Prompt and Refactoring playbooks (docs/project-infrastructure.md
    # "The modules tier"). Each drive runs in this order, every command in the
    # drive's archived candidate directory on the staging host:
    #   lint (the revision's changed .mjs/.vue files) -> load -> restart -> ready
    #   -> test once per affected module and core directory -> browser (if declared)
    #   -> finallyCommands.
    # The candidate is loaded INTO the shared stage instance and stays running there
    # until the next drive; a drive holds the whole staging host, so one candidate
    # at a time. There is no base drive: a failing test of an affected module blocks.
    # The framework has no per-module test script, so the commands are composed from
    # what it has: quick-deploy.sh (load), the starter (restart) and the running
    # instance's `selftest` CLI (test).
    modules:
      # Top-level directories that are collections; <collection>/<module>/ is a module.
      collections: ['@*', '*-modules']
      # A change at the repository root runs the framework's own selftests under this filter.
      rootFilter: core
      # The project's linter over the changed files, each passed as one quoted argument.
      lint: { id: lint, run: 'node_modules/.bin/eslint --no-warn-ignored {{files}}', timeoutSeconds: 300 }
      # quick-deploy.sh copies the application source from the candidate directory
      # (its working directory) into the stage instance, keeping instance config,
      # secrets, datastore and logs, as it does for a manual quick deploy.
      load: { id: load, run: '/opt/staging.example.invalid/quick-deploy.sh --from "$PWD"', timeoutSeconds: 900 }
      # The starter: the instance's own service, restarted on the loaded source.
      restart: { id: restart, run: 'systemctl restart project.service', timeoutSeconds: 180 }
      # Bounded readiness: the starter writes its ready line to the application log.
      ready: { id: ready, run: 'timeout 300 sh -c "until grep -q ready /opt/staging.example.invalid/runtime/log/current/project.log; do sleep 2; done"', timeoutSeconds: 320 }
      # The selftest CLI of the running instance, once per affected module
      # (filter <collection>/<module>) and per core directory (filter = the directory).
      test: { id: module-selftest, run: '/opt/staging.example.invalid/runtime/processes/cli/project.main selftest {{filter}}', timeoutSeconds: 900 }
      # A script that tests several filters in one pass takes them all in ONE command instead:
      # test: { id: module-selftest, run: '/opt/staging.example.invalid/tooling/selftest-many.sh {{filters}}', report: selftest, timeoutSeconds: 1800 }
      # Browser scenarios of a module, when the project has a runner for them:
      # browser: { id: module-browser, run: '/opt/staging.example.invalid/runtime/processes/cli/project.main browser {{filter}}', timeoutSeconds: 900 }
      # The selftest report and the log tail, recorded as for any drive.
      finallyCommands:
        - id: collect-selftest-report
          run: 'echo "== runtime/selftest.report"; cat /opt/staging.example.invalid/runtime/selftest.report'
          report: selftest
          timeoutSeconds: 60
    # Under structured confinement (`kind` on every command) load, restart, ready,
    # test and the collector are `kind: privileged`: they act on the stage instance,
    # which a candidate command cannot see; lint may be `kind: candidate`.
  release:
    targets:
      staging:
        # The installed procedure tools/releases/<site>.py reads its target settings
        # from host-config/releases/<site>-targets.json when the release runs. The
        # workdir is the panel checkout's tools/releases (here installed in /opt/devpanel).
        workdir: /opt/devpanel/tools/releases
        ownership: Apply only the application's own source from the engine archive; preserve instance config, secrets, datastore and logs.
        rollback: automatic
        commands:
          inspect: { run: 'python3 ./example.py inspect', timeoutSeconds: 60 }
          checkpoint: { run: 'python3 ./example.py checkpoint', timeoutSeconds: 900 }
          verifyCheckpoint: { run: 'python3 ./example.py verify-checkpoint', timeoutSeconds: 900 }
          apply: { run: 'python3 ./example.py apply', timeoutSeconds: 1800 }
          verifyRelease: { run: 'python3 ./example.py verify-release', timeoutSeconds: 300 }
          restart: { run: 'python3 ./example.py restart', timeoutSeconds: 120 }
          observe: { run: 'python3 ./example.py observe', timeoutSeconds: 240 }
          test: { run: 'python3 ./example.py test', timeoutSeconds: 900 }
          restore: { run: 'python3 ./example.py restore', timeoutSeconds: 900 }
          verifyRestore: { run: 'python3 ./example.py verify-restore', timeoutSeconds: 120 }
