id: triage
version: 3
title: Triage
description: A short coordinator handoff, then two investigator seats at once, each recording a disposition and an order-of-magnitude size.
tactic: triage
roles:
  coordinator:
    description: Coordinates from supplied task, reports and engine evidence only; delegates technical work.
    invokesOthers: false
  investigator:
    description: Checks the reported claim, records a short disposition and sizes the issue (Minor or Major, affected modules).
    writesCode: false
    invokesOthers: false
  investigator-2:
    description: A second, independent sizing of the same issue, run at the same time. Its size and modules are folded with the first seat's; its findings are never published.
    optional: true
    writesCode: false
    invokesOthers: false
workspace:
  isolation: git-worktree
  requireCleanBase: true
  onUnsupported: block
  base: working-tree
reviewPolicy:
  substantial:
    anyOf:
      - blocking: true
      - severity: [critical, major]
  protocolRepair:
    maxAttempts: 1
    onExhausted: block
checks:
  requirement: none
  boundToRevision: true
budgets:
  maxSteps: 6
  wallClockMinutes: 10
  maxTokens: 200000
  maxCostUsd: 1
  onExhausted: unresolved
phases:
  - id: brief
    step:
      id: brief
      role: coordinator
      prompt: brief.md
      output: triageBrief
      context:
        - issue
        - window
  - id: investigate
    step:
      id: investigate
      role: investigator
      prompt: investigate.md
      output: triageDisposition
      concurrent: true
      context:
        - issue
        - project
        - steps.brief.output.prompt
        - window
  # The second seat sizes the same issue at the same time (concurrent steps run
  # at once); the run records major unless both seats say minor.
  - id: investigate-2
    step:
      id: investigate-2
      role: investigator-2
      prompt: investigate.md
      output: triageDisposition
      concurrent: true
      context:
        - issue
        - project
        - steps.brief.output.prompt
        - window
completion:
  requires:
    - reportDispositionRecorded
    - deliveryCompleted
  autoClose:
    minimumVerification: review-only
  delivery:
    action: none
    revalidateBeforeDelivery: true
  onFailure:
    roundsExhausted: unresolved
    disagreement: unresolved
    budgetExhausted: unresolved
    protocolBlocked: unresolved
    checksUnavailable: unresolved
    closureNotAuthorised: unresolved
