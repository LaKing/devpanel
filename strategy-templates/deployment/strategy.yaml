id: deployment
version: 1
title: deployment
description: Coordinated deployment with configurable occupied seats and durable evidence.
roles:
  coordinator:
    description: Coordinates from supplied task, reports and engine evidence only; delegates technical work.
    invokesOthers: false
  release-operator:
    description: Assesses the selected target and installed release procedure before mutation,
      then checks release identity, checkpoint receipts, startup logs and test results.
    writesCode: false
    invokesOthers: false
  verifier-1:
    description: Independently assesses the release identity, checkpoint, startup logs and test evidence.
    optional: true
    invokesOthers: false
  verifier-2:
    description: Independently assesses the release identity, checkpoint, startup logs and test evidence.
    optional: true
    invokesOthers: false
  verifier-3:
    description: Independently assesses the release identity, checkpoint, startup logs and test evidence.
    optional: true
    invokesOthers: false
  verifier-4:
    description: Independently assesses the release identity, checkpoint, startup logs and test evidence.
    optional: true
    invokesOthers: false
workspace:
  isolation: git-worktree
  requireCleanBase: true
  onUnsupported: block
  base: working-tree
reviewPolicy:
  substantial:
    anyOf:
      - blocking: true
      - severity:
          - critical
          - major
  protocolRepair:
    maxAttempts: 2
    onExhausted: block
checks:
  requirement: none
  boundToRevision: true
budgets:
  maxSteps: 160
  wallClockMinutes: 480
  onExhausted: unresolved
phases:
  - id: triage
    step:
      id: triage
      role: coordinator
      prompt: orient.md
      output: triageResult
      context: &a1
        - issue
        - project
        - acceptanceCriteria
        - window
        - reports
        - findings.outstanding
        - decisions
    transitions:
      - when: output.fit == false
        to: abort
        outcome: unresolved
      # One run either finishes on its own or does not start: a question for
      # the owner ends the run after triage (the slot and worktree are freed)
      # and the answer starts a fresh one.
      - when: output.autonomy.verdict == needs-owner-input
        to: ask-owner
      - when: output.autonomy.verdict == too-large
        to: ask-owner
      - when: output.suggestion.action == needs-input
        to: ask-owner
  - id: brief
    step:
      id: brief
      role: coordinator
      prompt: brief.md
      output: handoff
      context: *a1
  - id: investigate-release-plan
    step:
      id: investigate-release-plan
      role: release-operator
      prompt: prepare-release.md
      output: releaseAssessment
      context:
        - issue
        - project
        - window
        - reports
        - steps.brief.output.prompt
        - decisions
  - id: authorize-release
    step:
      id: authorize-release
      role: coordinator
      prompt: authorize-release.md
      output: handoff
      context:
        - issue
        - project
        - window
        - reports
        - decisions
    transitions:
      - when: "!output.releaseApproved"
        to: abort
        outcome: unresolved
  - id: investigate-release-operator
    step:
      id: investigate-release-operator
      role: release-operator
      prompt: investigate.md
      output: releaseAssessment
      context:
        - issue
        - project
        - acceptanceCriteria
        - window
        - reports
        - findings.outstanding
        - decisions
        - steps.brief.output.prompt
  - id: investigate-verifier-1
    step:
      id: investigate-verifier-1
      role: verifier-1
      prompt: investigate.md
      output: releaseAssessment
      context:
        - issue
        - project
        - acceptanceCriteria
        - window
        - reports
        - findings.outstanding
        - decisions
        - steps.brief.output.prompt
  - id: investigate-verifier-2
    step:
      id: investigate-verifier-2
      role: verifier-2
      prompt: investigate.md
      output: releaseAssessment
      context:
        - issue
        - project
        - acceptanceCriteria
        - window
        - reports
        - findings.outstanding
        - decisions
        - steps.brief.output.prompt
  - id: investigate-verifier-3
    step:
      id: investigate-verifier-3
      role: verifier-3
      prompt: investigate.md
      output: releaseAssessment
      context:
        - issue
        - project
        - acceptanceCriteria
        - window
        - reports
        - findings.outstanding
        - decisions
        - steps.brief.output.prompt
  - id: investigate-verifier-4
    step:
      id: investigate-verifier-4
      role: verifier-4
      prompt: investigate.md
      output: releaseAssessment
      context:
        - issue
        - project
        - acceptanceCriteria
        - window
        - reports
        - findings.outstanding
        - decisions
        - steps.brief.output.prompt
  # staging-then-production ("Staging first, Deployment on success"): the engine
  # promotes this run's own staging archive to production only after the staging
  # release completed and every staging assessment above accepted it; then the
  # same seats assess the production release. Other environments skip these.
  - id: investigate-production-operator
    when: release.mode == staging-then-production
    step:
      id: investigate-production-operator
      role: release-operator
      prompt: investigate.md
      output: releaseAssessment
      context:
        - issue
        - project
        - acceptanceCriteria
        - window
        - reports
        - findings.outstanding
        - decisions
        - steps.brief.output.prompt
  - id: investigate-production-verifier-1
    when: release.mode == staging-then-production
    step:
      id: investigate-production-verifier-1
      role: verifier-1
      prompt: investigate.md
      output: releaseAssessment
      context:
        - issue
        - project
        - acceptanceCriteria
        - window
        - reports
        - findings.outstanding
        - decisions
        - steps.brief.output.prompt
  - id: investigate-production-verifier-2
    when: release.mode == staging-then-production
    step:
      id: investigate-production-verifier-2
      role: verifier-2
      prompt: investigate.md
      output: releaseAssessment
      context:
        - issue
        - project
        - acceptanceCriteria
        - window
        - reports
        - findings.outstanding
        - decisions
        - steps.brief.output.prompt
  - id: investigate-production-verifier-3
    when: release.mode == staging-then-production
    step:
      id: investigate-production-verifier-3
      role: verifier-3
      prompt: investigate.md
      output: releaseAssessment
      context:
        - issue
        - project
        - acceptanceCriteria
        - window
        - reports
        - findings.outstanding
        - decisions
        - steps.brief.output.prompt
  - id: investigate-production-verifier-4
    when: release.mode == staging-then-production
    step:
      id: investigate-production-verifier-4
      role: verifier-4
      prompt: investigate.md
      output: releaseAssessment
      context:
        - issue
        - project
        - acceptanceCriteria
        - window
        - reports
        - findings.outstanding
        - decisions
        - steps.brief.output.prompt
  - id: confirm
    step:
      id: confirm
      role: coordinator
      prompt: confirm.md
      output: closureConfirmation
      context: *a1
completion:
  requires:
    - coordinatorConfirmation
    - deliveryCompleted
  autoClose:
    minimumVerification: review-only
  delivery:
    action: none
    revalidateBeforeDelivery: true
  onFailure:
    roundsExhausted: unresolved
    disagreement: unresolved
    budgetExhausted: unresolved
    protocolBlocked: unresolved
    checksUnavailable: unresolved
    closureNotAuthorised: unresolved
tactic: deployment
