id: staging
version: 2
title: Staging
description: Coordinated staging with configurable occupied seats and durable evidence.
strategy: staging
strategyVersion: 1
participants:
  coordinator:
    model: opus-5-5
    effort: low      # the owner's default since 2026-11-07: a low-effort coordinator everywhere
  release-operator:
    model: opus-5-5
    effort: high   # was xhigh; high by default since 2026-09-23 (turn latency), xhigh selectable per run
autoClose:
  minimumVerification: review-only
  justification: Closure requires completed staging operations and accepted release assessments. Every occupied verifier must finish; minor nonblocking observations do not invalidate a release.
budgets:
  maxSteps: 120
  wallClockMinutes: 240
