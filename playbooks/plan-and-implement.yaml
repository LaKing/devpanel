id: plan-and-implement
version: 3
title: Plan and implement
description: Coordinated plan-and-implement with configurable occupied seats and
  durable evidence.
strategy: plan-and-implement
strategyVersion: 1
participants:
  coordinator:
    model: opus-5-5
    effort: low      # the owner's default since 2026-11-07: a low-effort coordinator everywhere
  planner:
    model: opus-5-5
    effort: medium   # Opus 5.5 medium by default since 2026-09-26; high/xhigh selectable per run
  auditor-1:
    model: gpt-6.1-sol
    effort: medium   # GPT-6.1 Sol medium is the default auditor since 2026-10-01 (GPT-6 Sol before)
autoClose:
  minimumVerification: review-only
  justification: All occupied auditors must approve both the plan and the implemented revision. With no auditors, closure records the absence of independent review; absent tests never count as passed.
budgets:
  maxSteps: 120
  wallClockMinutes: 240
delivery:
  action: apply-to-source
